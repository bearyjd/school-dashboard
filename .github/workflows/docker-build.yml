name: Docker build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      IMAGE: ghcr.io/bearyjd/school-dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify and record source revisions
        id: source
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          test "$revision" = "$GITHUB_SHA"
          submodules=$(git submodule status --recursive)
          if grep -Eq '^[-+U]' <<< "$submodules"; then
            echo "::error::A submodule is missing or does not match its gitlink"
            exit 1
          fi
          git diff --exit-code --stat --ignore-submodules=none HEAD --

          {
            printf 'labels<<EOF\n'
            printf 'org.opencontainers.image.source=%s/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
            printf 'org.opencontainers.image.revision=%s\n' "$revision"
            for vendor in gc ixl-scrape powerschool-scrape schoology-scrape; do
              actual=$(git -C "vendor/$vendor" rev-parse HEAD)
              expected=$(git rev-parse "HEAD:vendor/$vendor")
              test "$actual" = "$expected"
              printf 'io.github.bearyjd.school-dashboard.vendor.%s.revision=%s\n' "$vendor" "$actual"
            done
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

          {
            printf '### Docker source revisions\n\n'
            printf -- "- Dashboard: \`%s\`\n" "$revision"
            for vendor in gc ixl-scrape powerschool-scrape schoology-scrape; do
              actual=$(git -C "vendor/$vendor" rev-parse HEAD)
              printf -- "- %s: \`%s\`\n" "$vendor" "$actual"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump version tag
        id: tag
        if: inputs.publish
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.publish }}
            type=raw,value=${{ steps.tag.outputs.new_tag }},enable=${{ inputs.publish }}
            type=sha,format=long

      - name: Build image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.source.outputs.labels }}

      - name: Verify published image digest
        if: inputs.publish
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Build did not return a valid image digest"
            exit 1
          fi
          immutable_ref="$IMAGE@$DIGEST"
          mapfile -t tags <<< "$IMAGE_TAGS"
          for ref in "$immutable_ref" "${tags[@]}"; do
            actual=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            if [[ "$actual" != "$DIGEST" ]]; then
              echo "::error::Registry digest for $ref is $actual, expected $DIGEST"
              exit 1
            fi
          done
          printf "\n### Verified image in GHCR\n\n\`%s\`\n" "$immutable_ref" >> "$GITHUB_STEP_SUMMARY"
