name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - pyproject.toml
      - requirements.lock
      - .gitmodules
      - "vendor/**"
      - "school_dashboard/**"
      - "web/**"
      - "docker/**"
      - "sync/**"
      - "config/**"
      - school-sync.sh
      - .github/workflows/docker.yml
      - .github/workflows/docker-build.yml

# Keep publishing runs for the same ref from updating :latest concurrently.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: true
    permissions:
      contents: write
      packages: write
