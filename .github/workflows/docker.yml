name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-compose.yml
      - pyproject.toml
      - requirements.lock
      - .gitmodules
      - "vendor/**"
      - "school_dashboard/**"
      - "web/**"
      - "docker/**"
      - "sync/**"
      - "config/**"
      - school-sync.sh
  # Build-only check on PRs (no login, no tag, no push, no secrets).
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - requirements.lock
      - .gitmodules
      - "vendor/**"
      - "school_dashboard/**"
      - "web/**"
      - "docker/**"
      - "sync/**"
      - "config/**"
      - school-sync.sh
      - .github/workflows/docker.yml

# Serialise builds so overlapping main runs cannot finish out of order and leave :latest on an older commit.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Update scrapers to latest
        run: git submodule update --remote vendor/ixl-scrape vendor/schoology-scrape

      - name: Bump version tag
        id: tag
        if: github.event_name != 'pull_request'
        uses: mathieudutour/github-tag-action@v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/bearyjd/school-dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.tag.outputs.new_tag }},enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
