<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/app/manifest.json" />
    <title>School Dashboard</title>
    <script>
      // Set the theme before first paint (keep in step with src/design/theme.ts).
      // Note: no CSP is configured today. If one is added, this inline script needs a nonce or hash.
      (function () {
        var t = 'midnight';
        try {
          var s = localStorage.getItem('school-theme');
          if (s === 'midnight' || s === 'daylight' || s === 'system') t = s;
        } catch (e) {}
        if (t === 'system') {
          t = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'daylight';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
