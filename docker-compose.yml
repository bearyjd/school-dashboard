services:
  dashboard:
    image: ghcr.io/bearyjd/school-dashboard:latest
    # `build:` is for local development (`docker compose build`). The server is pull-only and has no build context.
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Loopback by default. Override DASHBOARD_BIND_ADDR / DASHBOARD_PORT in the `.env` file next to docker-compose.yml
      # (compose reads that file for ${...} interpolation; config/env only feeds the container). See
      # docs/ops/host-allowlist-and-port-binding.md. The gunicorn bind inside the container is unchanged.
      - "${DASHBOARD_BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-5000}:5000"
    volumes:
      - ./state:/app/state
      # web/ is deliberately NOT mounted: a host copy would shadow the image's web/ (app.py,
      # templates, built SPA), so `docker compose pull` would not update the app.
      # config/ holds env and school-dashboard.json (roster); dir mount avoids
      # Docker creating a directory when the roster file is missing
      - ./config:/app/config:ro
      # gog OAuth credentials (set up once with: gog auth add ...)
      - /root/.config/gogcli:/root/.config/gogcli
      # IXL session cache
      - /root/.ixl:/root/.ixl
      # Schoology session cache
      - /root/.sgy:/root/.sgy
      # GC token + Playwright browser context
      - /root/.gc:/root/.gc
      # PowerSchool credentials (.env, chmod 600) + session cache
      - /root/.powersched:/root/.powersched
    env_file:
      - config/env
    environment:
      - TZ=America/New_York
      - SCHOOL_DASHBOARD_CONFIG=/app/config/school-dashboard.json
      - SCHOOL_STATE_PATH=/app/state/school-state.json
      - SCHOOL_DB_PATH=/app/state/school.db
      - SCHOOL_FACTS_PATH=/app/state/facts.json
      - SCHOOL_EMAIL_DIGEST=/app/state/email-digest.json
      - SCHOOL_CALENDAR_PDF=/app/state/calendar.pdf
      - SCHOOL_DASHBOARD_HTML=/app/state/school-dashboard.html
