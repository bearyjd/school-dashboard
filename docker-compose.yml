services:
  dashboard:
    image: ghcr.io/bearyjd/school-dashboard:latest
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./state:/app/state
      - ./web:/app/web
      # config/ holds env and school-dashboard.json (roster); dir mount avoids
      # Docker creating a directory when the roster file is missing
      - ./config:/app/config:ro
      # gog OAuth credentials (set up once with: gog auth add ...)
      - /root/.config/gogcli:/root/.config/gogcli
      # IXL session cache
      - /root/.ixl:/root/.ixl
      # Schoology session cache
      - /root/.sgy:/root/.sgy
      # GC token + Playwright browser context
      - /root/.gc:/root/.gc
    env_file:
      - config/env
    environment:
      - TZ=America/New_York
      - SCHOOL_DASHBOARD_CONFIG=/app/config/school-dashboard.json
      - SCHOOL_STATE_PATH=/app/state/school-state.json
      - SCHOOL_DB_PATH=/app/state/school.db
      - SCHOOL_FACTS_PATH=/app/state/facts.json
      - SCHOOL_EMAIL_DIGEST=/app/state/email-digest.json
      - SCHOOL_CALENDAR_PDF=/app/state/calendar.pdf
      - SCHOOL_DASHBOARD_HTML=/app/state/school-dashboard.html
